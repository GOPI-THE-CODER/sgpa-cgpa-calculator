name: Validate without deployment

# This workflow is CI-only. It does not upload a Pages artifact and does not
# call the deployment workflow.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Require the committed test suite
        shell: bash
        run: |
          set -euo pipefail
          if ! find tests -name '*.test.js' -print -quit | grep -q .; then
            echo "::error::No test files were found in tests/"
            exit 1
          fi

      - name: Run tests without installing dependencies
        run: node --test

      - name: Verify the vendored authentication SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ee3be8de192b97cb1d73d1e95d6b82bb1f6b658c0f97c4ef757fc331996ed3d3  vendor/supabase.js" | sha256sum -c -
          test -f vendor/supabase-LICENSE.txt

      - name: Enforce the temporary auth-disabled release policy
        run: node tools/verify-auth-disabled.js

      - name: Validate the production artifact without publishing it
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(mktemp -d)"
          trap 'rm -rf "$artifact"' EXIT
          mkdir -p "$artifact/icons" "$artifact/vendor"
          cp index.html styles.css calculator.js script.js auth-provider.js sw.js \
             manifest.json offline.html "$artifact/"
          cp icons/icon-192.svg icons/icon-512.svg "$artifact/icons/"
          cp vendor/supabase.js vendor/supabase-LICENSE.txt "$artifact/vendor/"

          required=(
            index.html
            styles.css
            calculator.js
            script.js
            auth-provider.js
            sw.js
            manifest.json
            offline.html
            vendor/supabase.js
            vendor/supabase-LICENSE.txt
            icons/icon-192.svg
            icons/icon-512.svg
          )

          for file in "${required[@]}"; do
            if [ ! -f "$artifact/$file" ]; then
              echo "::error::Missing required artifact file: $file"
              exit 1
            fi
          done

          actual="$(cd "$artifact" && find . -type f -print | sort)"
          expected="$(printf '%s\n' "${required[@]}" | sed 's|^|./|' | sort)"

          if [ "$actual" != "$expected" ]; then
            echo "::error::Artifact contents do not match the production allowlist"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

          echo "Validated exactly ${#required[@]} production files; nothing was uploaded."
